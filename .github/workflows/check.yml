name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check versions, the scanner pin and the hook
        run: make check
      - name: Validate the Gemini CLI extension
        run: npx --yes @google/gemini-cli@0.71.1 extensions validate .
      - name: Validate the Cursor plugin with Cursor's own validator
        run: |
          git init -q /tmp/cursor-plugins
          git -C /tmp/cursor-plugins fetch -q --depth 1 https://github.com/cursor/plugins b7b93c36be9bcc36a74db438e0fd385d660bc559
          git -C /tmp/cursor-plugins checkout -q FETCH_HEAD
          mkdir -p /tmp/cv/scripts
          cp -r /tmp/cursor-plugins/schemas /tmp/cv/
          cp /tmp/cursor-plugins/scripts/validate-plugins.mjs /tmp/cv/scripts/
          cp -r .cursor-plugin plugins /tmp/cv/
          cd /tmp/cv
          echo '{"type":"module"}' > package.json
          npm install --silent --no-audit --no-fund ajv@8.17.1 ajv-formats@3.0.1
          node scripts/validate-plugins.mjs

  scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Scan with the Spellwarden action
        uses: spellwarden-ai/scan@c75a177e803dce58b9df9f7705e324128b89c5d3  # v1.26.0
        with:
          fail-on: low
          comment: "false"
          telemetry: "false"
          sarif-upload: ${{ github.event_name == 'push' }}
